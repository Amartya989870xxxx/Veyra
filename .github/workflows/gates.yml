name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase0-matrix:
    name: Phase 0 — research matrix gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate scenario matrix against feature registry
        run: python research/validate.py --strict

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check research/ app/ tests/

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Property tests run 10x the examples in CI. The point of a property test is the
      # input nobody thought of, and finding it is a function of how many are tried.
      - name: Unit, property and gate tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q
