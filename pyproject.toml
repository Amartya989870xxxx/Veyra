[project]
name = "veyra"
version = "0.1.0"
description = "Veyra - incident-level fraud spike intelligence for merchants (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "redis>=5.0",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--strict-markers -m 'not slow'"
markers = [
    "slow: long-running evaluation tests",
    "gate: leakage gate - never skip or weaken to make CI green",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

# v1 modules awaiting their rewrite phase. This list is the shrinking to-do of the
# migration, not a permanent exemption: a phase deletes its own entries here as it
# rewrites the module, and the entry cannot be re-added. Everything not listed --
# app/core, app/api, app/windows.py, tests/, research/ -- is lint-clean today and stays
# that way.
extend-exclude = [
    "app/schemas/entities.py",   # Phase 1.3 - payment-centric rewrite
    "app/schemas/events.py",     # Phase 1.3 - payment-centric rewrite
    "app/schemas/risk.py",       # Phase 1.3 - becomes the incident schema
    "app/ingestion/service.py",  # Phase 1.3 - repointed at payment events
    "app/features/",             # Phase 3 - rewritten as families A-J
    "app/graph/",                # Phase 3 - extended for per-window degree structure
    "app/risk/",                 # Phase 4 - Baseline A/B/C
    "app/evaluation/",           # Phase 5 - temporal splits, incident metrics, gates
    "app/intent/",               # Phase 6 - becomes app/explain with a grounding guard
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = false
warn_unused_ignores = false
