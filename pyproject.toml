[project]
name = "veyra"
version = "0.1.0"
description = "Veyra - incident-level fraud spike intelligence for merchants (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "redis>=5.0",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--strict-markers -m 'not slow'"
markers = [
    "slow: long-running evaluation tests",
    "gate: leakage gate - never skip or weaken to make CI green",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

# Modules still carrying v1-era lint debt. This list is a shrinking to-do, not a
# permanent exemption: delete an entry once its module is clean.
#
# Entries for app/risk/, app/intent/ and app/schemas/risk.py were removed because
# those paths no longer exist -- they were silencing nothing.
#
# NOTE: the rest of the tree is NOT lint-clean (an earlier version of this comment
# claimed it was). `ruff check .` reports ~409 findings, mostly E501 line length
# and F401 unused imports. They are not auto-fixed here because F401 in this
# codebase can be load-bearing -- SQLAlchemy model registration and __init__
# re-exports both rely on imports that look unused. See README "Known gaps".
extend-exclude = [
    "app/schemas/entities.py",   # payment-centric rewrite pending
    "app/schemas/events.py",     # payment-centric rewrite pending
    "app/ingestion/service.py",  # repointed at payment events
    "app/features/",             # families A-J rewrite
    "app/graph/",                # per-window degree structure
    "app/evaluation/",           # temporal splits, incident metrics, gates
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = false
warn_unused_ignores = false
